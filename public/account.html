<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Бункер — Аккаунт</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="account">
  <div class="page">
    <a href="index.html" class="back-link">← На главную</a>

    <header class="site-header">
      <div class="site-header__badge">Реестр выживших</div>
      <h1>Аккаунт</h1>
      <p class="site-header__tagline" id="accountTagline">
        Регистрация, вход и профиль игрока.
      </p>
    </header>

    <section id="authSection" class="panel">
      <div class="auth-tabs" role="tablist">
        <button type="button" class="auth-tabs__btn auth-tabs__btn--active" data-tab="login">Вход</button>
        <button type="button" class="auth-tabs__btn" data-tab="register">Регистрация</button>
      </div>

      <form id="loginForm" class="auth-form">
        <label class="field">
          <span class="field__label">Никнейм</span>
          <input type="text" id="loginNickname" maxlength="20" required autocomplete="username">
        </label>
        <label class="field">
          <span class="field__label">Пароль</span>
          <input type="password" id="loginPassword" required autocomplete="current-password">
        </label>
        <p id="loginError" class="form-error hidden"></p>
        <button type="submit" class="btn btn--amber">Войти</button>
      </form>

      <form id="registerForm" class="auth-form hidden">
        <label class="field">
          <span class="field__label">Никнейм</span>
          <input type="text" id="regNickname" maxlength="20" required autocomplete="username">
          <span class="field__hint">3–20 символов: буквы, цифры, _ и -</span>
        </label>
        <label class="field">
          <span class="field__label">Пароль</span>
          <input type="password" id="regPassword" minlength="6" required autocomplete="new-password">
        </label>
        <label class="field">
          <span class="field__label">Повтор пароля</span>
          <input type="password" id="regPassword2" minlength="6" required autocomplete="new-password">
        </label>
        <p id="registerError" class="form-error hidden"></p>
        <button type="submit" class="btn btn--amber">Создать аккаунт</button>
      </form>
    </section>

    <section id="profileSection" class="panel hidden">
      <div class="profile-header">
        <div class="profile-avatar-wrap">
          <img id="profileAvatar" class="profile-avatar" src="icons/default-avatar.svg" alt="Аватар">
          <button type="button" id="changeAvatarBtn" class="btn btn--small profile-avatar__btn">Изменить фото</button>
        </div>
        <div class="profile-header__info">
          <h2 class="profile-nickname" id="profileNickname">—</h2>
          <div class="profile-stats">
            <span class="profile-stat">Игр: <strong id="statGames">0</strong></span>
            <span class="profile-stat">Выживаний: <strong id="statSurvivals">0</strong></span>
          </div>
        </div>
      </div>

      <form id="profileForm" class="profile-form">
        <label class="field">
          <span class="field__label">О себе</span>
          <textarea id="profileBio" rows="4" maxlength="500" placeholder="Коротко о вашем опыте выживания…"></textarea>
        </label>
        <p id="profileError" class="form-error hidden"></p>
        <p id="profileSuccess" class="form-success hidden"></p>
        <div class="profile-form__actions">
          <button type="submit" class="btn btn--amber">Сохранить</button>
          <button type="button" id="logoutBtn" class="btn">Выйти</button>
        </div>
      </form>

      <p class="profile-hint">
        <a href="player.html">Перейти к игре</a> — в сессии можно показать никнейм или другое имя.
      </p>
    </section>
  </div>

  <script src="config.js"></script>
  <script src="auth.js"></script>
  <script src="avatar-crop.js"></script>
  <script src="account.js"></script>
</body>
</html>
